# Builds MechanicsDSL Studio for Windows and macOS, runs each build's self-test, and
# attaches the results to the GitHub release. Runs when a release is published, and on
# demand from the Actions tab (then the builds are kept as workflow artifacts only).
name: Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            pattern: dist/*.zip
          - os: macos-15
            label: macOS (Apple silicon)
            pattern: dist/*.dmg
          - os: macos-15-intel
            label: macOS (Intel)
            pattern: dist/*.dmg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest pillow

      - name: Test, build and self-test
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: MechanicsDSL-Studio-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ${{ matrix.pattern }} --clobber
